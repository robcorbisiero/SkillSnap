name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SkillSnap.slnx
      - run: dotnet build SkillSnap.slnx -c Release --no-restore
      - run: dotnet test SkillSnap.slnx -c Release --no-build --logger trx
      - run: dotnet publish src/SkillSnap.Client -c Release --no-restore -o artifacts/client
